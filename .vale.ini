# Vale configuration for the German content archive.
# Policy and rule rationale: documentation/content/german-orthography-and-grammar.md
StylesPath = .vale/styles
MinAlertLevel = warning

# MDX needs the external mdx2vast parser; the archive has a single MDX file,
# so only Markdown is linted.
[*.md]
BasedOnStyles = SamuiDE

# Proper names that contain modern spellings and must stay unchanged.
TokenIgnores = (Fantastischen Vier)
