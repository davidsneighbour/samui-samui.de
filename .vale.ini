# Vale configuration for the German content archive.
# Policy and rule rationale: documentation/content/german-orthography-and-grammar.md
StylesPath = .vale/styles
MinAlertLevel = warning

# All Markdown below src/content is German. The section starts with `**/` so
# it also matches the absolute paths editors pass to Vale. Markdown elsewhere
# (documentation/, README.md) is English and gets no style from this file.
# MDX needs the external mdx2vast parser; the archive has a single MDX file,
# so only Markdown is linted.
#
# Run Vale with --no-global: Vale adds the styles of the global config
# (~/.config/vale/.vale.ini, English) to these, and a project config cannot
# remove them. .vscode/settings.json sets vale.valeCLI.noGlobal for the editor.
[**/src/content/**/*.md]
BasedOnStyles = SamuiDE

# Proper names that contain modern spellings and must stay unchanged.
TokenIgnores = (Fantastischen Vier)
