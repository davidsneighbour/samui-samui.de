[build]
command = "npm run build"
publish = "dist"

[functions]
directory = "src/netlify/functions"

[[redirects]]
from = "/tags/"
to = "/themen/"
status = 301

[[redirects]]
from = "/tags/*"
to = "/themen/:splat"
status = 301

# Resource audit behind this CSP (2026-07-21, issues
# https://github.com/davidsneighbour/samui-samui.de/issues/709,
# https://github.com/davidsneighbour/samui-samui.de/issues/722, and
# https://github.com/davidsneighbour/samui-samui.de/issues/1227): Matomo
# analytics (analytics.dnbhub.xyz), Giscus comments (giscus.app -- lazy-loaded
# script, iframe, and default.css it injects into the parent document),
# YouTube (youtube-nocookie.com) and Vimeo (player.vimeo.com) post embeds,
# Cloudflare Turnstile (challenges.cloudflare.com, only active when
# TURNSTILE_SITE_KEY is set), Pagefind's WASM search index
# ('wasm-unsafe-eval', same-origin), and MapLibre/OpenFreeMap. MapLibre 6 is
# consumed as an ESM package; OpenFreeMap map styles, tiles, glyphs, sprites,
# and related assets are fetched from tiles.openfreemap.org only after an
# interactive map island becomes visible.
# Verified against a preview deploy -- grep `<iframe src="https://` across
# src/content/posts for the full embed-domain list if new embed types are added
# later.
[[headers]]
for = "/*"

  [headers.values]
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://challenges.cloudflare.com https://giscus.app https://analytics.dnbhub.xyz; style-src 'self' 'unsafe-inline' https://giscus.app; img-src 'self' data: blob: https:; font-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com https://giscus.app https://challenges.cloudflare.com; connect-src 'self' https://analytics.dnbhub.xyz https://tiles.openfreemap.org; worker-src blob:; child-src blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"
  Referrer-Policy = "strict-origin-when-cross-origin"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "SAMEORIGIN"

[[headers]]
for = "/assets/styles/giscus-samui-*.css"

  [headers.values]
  Access-Control-Allow-Origin = "https://giscus.app"
  Cache-Control = "public, max-age=3600"

[[headers]]
for = "/assets/webfonts/*"

  [headers.values]
  Access-Control-Allow-Origin = "https://giscus.app"
