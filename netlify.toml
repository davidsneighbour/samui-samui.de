[build]
command = "npm run build"
publish = "dist"

[functions]
directory = "netlify/functions"

# Resource audit behind this CSP (2026-07-18, issue #709): Matomo analytics
# (analytics.dnbhub.xyz), Giscus comments (giscus.app -- lazy-loaded script,
# iframe, and default.css it injects into the parent document), YouTube
# (youtube-nocookie.com) and Vimeo (player.vimeo.com) post embeds, Google
# reCAPTCHA v3 (google.com + gstatic.com, only active when
# RECAPTCHA_SITE_KEY is set), and Pagefind's WASM search index
# ('wasm-unsafe-eval', same-origin). Verified against a preview deploy --
# grep `<iframe src="https://` across src/content/posts for the full
# embed-domain list if new embed types are added later.
[[headers]]
for = "/*"

  [headers.values]
  Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.google.com https://www.gstatic.com https://giscus.app https://analytics.dnbhub.xyz; style-src 'self' 'unsafe-inline' https://giscus.app; img-src 'self' data: https:; font-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com https://giscus.app https://www.google.com; connect-src 'self' https://analytics.dnbhub.xyz; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"
  Referrer-Policy = "strict-origin-when-cross-origin"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "SAMEORIGIN"
