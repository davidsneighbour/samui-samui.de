name: Check video thumbnail availability

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: check-video-thumbnails
  cancel-in-progress: true

jobs:
  verify:
    name: Verify referenced YouTube/Vimeo videos are still live
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify video thumbnails
        id: verify
        run: |
          set +e
          npm run thumbnails:verify > verify-output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat verify-output.txt

      - name: Report editorial and restoration candidates
        run: |
          npm run publisher -- relic list --status=candidate >> verify-output.txt
          npm run publisher -- relic list --status=restoration-candidate >> verify-output.txt
          cat verify-output.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Retain media metadata in repository history
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- src/data/video-media.json; then exit 0; fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const file = 'src/data/video-media.json';
          const sha = execFileSync('git', ['rev-parse', `HEAD:${file}`], { encoding: 'utf8' }).trim();
          fs.writeFileSync('media-history-update.json', JSON.stringify({
            message: 'chore(content): retain weekly media observations\n\nPreserve historical evidence for editorial review without classifying posts.\n\nSee #1868',
            content: fs.readFileSync(file).toString('base64'),
            sha,
            branch: process.env.DEFAULT_BRANCH,
          }));
          NODE
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/src/data/video-media.json" --input media-history-update.json > /dev/null

      - name: Preserve observations for editorial review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: video-media-review
          path: |
            src/data/video-media.json
            verify-output.txt

      - name: Build issue body
        if: steps.verify.outputs.exit_code != '0'
        run: |
          echo "Weekly automated check found persistent media failures requiring editorial review, referenced" > issue-body.md
          echo "in the site. These are candidates, not editorial classifications (checked via" >> issue-body.md
          echo '`npm run thumbnails:verify`).' >> issue-body.md
          echo >> issue-body.md
          echo '```' >> issue-body.md
          cat verify-output.txt >> issue-body.md
          echo '```' >> issue-body.md

      - name: Find existing tracking issue
        id: existing
        if: steps.verify.outputs.exit_code != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEARCH: "in:title \"chore(content): dead video(s) detected\""
        run: |
          echo "number=$(gh issue list --state open --search "$SEARCH" --json number --jq '.[0].number // empty')" >> "$GITHUB_OUTPUT"

      - name: Comment on existing tracking issue
        if: steps.verify.outputs.exit_code != '0' && steps.existing.outputs.number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.existing.outputs.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file issue-body.md

      - name: File new tracking issue
        if: steps.verify.outputs.exit_code != '0' && steps.existing.outputs.number == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: "chore(content): dead video(s) detected"
        run: |
          gh issue create --title "$TITLE" --label "type:bug" --label "status:confirmed" --label "prio:low" --body-file issue-body.md
