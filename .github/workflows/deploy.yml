name: Deploy production

# Manual on purpose: deployments stay an explicit decision
# (https://github.com/davidsneighbour/samui-samui.de/issues/1708). The
# workflow builds once and ships that dist/ to DreamHost; DreamHost never
# builds. See documentation/hosting/deployment.md#github-actions.
on:
  workflow_dispatch:
    inputs:
      purge:
        description: Cloudflare cache invalidation
        type: choice
        default: auto
        options:
          - auto
          - html
          - urls
          - none
      worker:
        description: Deploy the /api/* Worker when its code changed
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, upload, purge, smoke-test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure SSH for DreamHost
        env:
          DREAMHOST_SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
          DREAMHOST_KNOWN_HOSTS: ${{ secrets.DREAMHOST_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DREAMHOST_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key: never trust whatever answers on first connect.
          printf '%s\n' "$DREAMHOST_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          DREAMHOST_HOST: ${{ secrets.DREAMHOST_HOST }}
          DREAMHOST_PATH: ${{ secrets.DREAMHOST_PATH }}
          DREAMHOST_USER: ${{ secrets.DREAMHOST_USER }}
          PURGE_MODE: ${{ inputs.purge }}
          TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          WORKER_FLAG: ${{ inputs.worker && '' || '--skip-worker' }}
        run: npm run deploy -- --yes --purge="$PURGE_MODE" $WORKER_FLAG
